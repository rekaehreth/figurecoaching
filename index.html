<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figure Coaching — Coming Soon</title>
    <meta
      name="description"
      content="Figure Coaching's website is under construction. Reach out at info@figurecoaching.hu."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&display=swap"
    />
    <style>
      :root {
        --cream: #e3d9c5;
        --pine-900: #1b4130;
        --pine: #235e49;
        --gold: #e0ab52;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--pine-900);
        color: var(--cream);
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }

      main {
        max-width: 520px;
      }

      h1 {
        margin: 0 0 16px;
        font-family: "Fraunces", Georgia, "Iowan Old Style", serif;
        font-weight: 600;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        color: var(--gold);
      }

      p {
        margin: 0 0 8px;
        font-size: 1.05rem;
        line-height: 1.6;
        color: var(--cream);
        opacity: 0.9;
      }

      a {
        color: var(--gold);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: border-color 0.2s ease;
      }

      a:hover,
      a:focus-visible {
        border-color: var(--gold);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Figure Coaching</h1>
      <p>Our website is under construction.</p>
      <p>
        In the meantime, reach out at
        <a href="mailto:info@figurecoaching.hu">info@figurecoaching.hu</a>
      </p>
    </main>
  </body>
</html>
