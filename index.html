<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figure Coaching — Coming Soon</title>
    <meta
      name="description"
      content="Figure Coaching's website is on its way. Reach out at info@figurecoaching.hu."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500&display=swap"
    />
    <style>
      :root {
        --cream: #e3d9c5;
        --pine-900: #1b4130;
        --pine: #235e49;
        --gold: #e0ab52;
        --gold-deep: #d4a026;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--cream);
        color: var(--pine-900);
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        padding: 32px 24px;
      }

      main {
        max-width: 440px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .mark {
        width: clamp(140px, 26vw, 210px);
        height: auto;
        margin-bottom: clamp(20px, 4vw, 32px);
        overflow: visible;
      }

      .mark path {
        stroke-dasharray: 1 2;
        stroke-dashoffset: 1;
        animation: draw linear forwards;
        animation-duration: var(--dur);
        animation-delay: var(--delay);
      }

      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      .reveal {
        opacity: 0;
        transform: translateY(10px);
        animation: fadeUp 0.7s ease forwards;
      }

      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .eyebrow {
        margin: 0 0 14px;
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: lowercase;
        color: var(--gold-deep);
        animation-delay: 2.5s;
      }

      h1 {
        margin: 0 0 18px;
        font-family: "Fraunces", Georgia, "Iowan Old Style", serif;
        font-weight: 600;
        font-size: clamp(1.9rem, 5vw, 2.6rem);
        line-height: 1.25;
        color: var(--pine-900);
        animation-delay: 2.65s;
      }

      h1 em {
        font-style: italic;
        font-weight: 500;
        color: var(--gold-deep);
      }

      p {
        margin: 0 0 22px;
        font-size: 1.05rem;
        line-height: 1.6;
        color: var(--pine);
        animation-delay: 2.85s;
      }

      a {
        display: inline-block;
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 1.05rem;
        color: var(--pine-900);
        text-decoration: none;
        padding-bottom: 2px;
        background-image: linear-gradient(var(--gold), var(--gold));
        background-size: 100% 1px;
        background-repeat: no-repeat;
        background-position: 0 100%;
        transition: background-size 0.25s ease, color 0.25s ease;
        animation-delay: 3s;
      }

      a:hover,
      a:focus-visible {
        color: var(--gold-deep);
        background-size: 100% 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .mark path {
          animation: none;
          stroke-dashoffset: 0;
        }

        .reveal {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        class="mark"
        role="img"
        aria-label="Figure Coaching logo"
        viewBox="0 0 130 130"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <g class="stroke-mark"></g>
        <defs></defs>
      </svg>

      <p class="eyebrow reveal">figure coaching</p>
      <h1 class="reveal">Still finding its <em>shape</em>.</h1>
      <p class="reveal">The new site is on its way. Say hello any time —</p>
      <a class="reveal" href="mailto:info@figurecoaching.hu">info@figurecoaching.hu</a>
    </main>

    <script>
      const SVG_NS = "http://www.w3.org/2000/svg";
      const SOURCE_MARK_URL = "assets/logo_v1_color_gradient_v2_export.svg";
      const GRADIENT_ID_RIGHT = "trace-grad-right";
      const GRADIENT_ID_LEFT = "trace-grad-left";
      const STROKE_WIDTH = 9;
      const TOTAL_TRACE_DURATION_SECONDS = 2.4;
      const NUMBERS_PER_CUBIC_SEGMENT = 6;
      
      async function initMark() {
        const svg = document.querySelector(".mark");
        const group = svg.querySelector(".stroke-mark");
        const defs = svg.querySelector("defs");

        try {
          const sourceDoc = await loadSourceMark(SOURCE_MARK_URL);
          const halves = parseSourceMark(sourceDoc);
          cloneGradientsInto(defs, halves.rightGradient, halves.leftGradient);

          const segmentPlan = buildSegmentPlan(halves);
          const pathElements = renderSegments(group, segmentPlan);
          applyProportionalTiming(pathElements, TOTAL_TRACE_DURATION_SECONDS);
        } catch (error) {
          console.error("Figure Coaching mark: falling back to a static logo.", error);
          renderFallbackMark(svg, SOURCE_MARK_URL);
        }
      }

      async function loadSourceMark(url) {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Failed to load ${url}: ${response.status} ${response.statusText}`);
        }
        const text = await response.text();
        return new DOMParser().parseFromString(text, "image/svg+xml");
      }

      function parseSourceMark(sourceDoc) {
        const paths = sourceDoc.querySelectorAll("path");
        const gradients = sourceDoc.querySelectorAll("linearGradient");
        assertExpectedPathAndGradientCounts(paths, gradients);

        const [rightPath, leftPath] = paths;
        const [rightGradient, leftGradient] = gradients;
        const right = splitIntoSubpaths(rightPath.getAttribute("d"));
        const left = splitIntoSubpaths(leftPath.getAttribute("d"));
        assertThreeSubpathsPerHalf(right, left);

        return {
          rightGradient,
          leftGradient,
          right: { reach: right[0], body: right[1], loop: right[2] },
          left: { reach: left[0], body: left[1], loop: left[2] },
        };
      }

      function assertExpectedPathAndGradientCounts(paths, gradients) {
        if (paths.length !== 2 || gradients.length !== 2) {
          throw new Error(
            `Expected 2 paths and 2 gradients in the source mark, found ${paths.length} paths and ${gradients.length} gradients.`
          );
        }
      }

      function assertThreeSubpathsPerHalf(rightSubpaths, leftSubpaths) {
        if (rightSubpaths.length !== 3 || leftSubpaths.length !== 3) {
          throw new Error(
            `Expected 3 subpaths per half (reach, body, loop), found ${rightSubpaths.length} on the right and ${leftSubpaths.length} on the left.`
          );
        }
      }

      function splitIntoSubpaths(d) {
        return d.match(/M[^M]*/g).map((subpath) => subpath.trim());
      }

      function cloneGradientsInto(defs, rightGradient, leftGradient) {
        [
          [rightGradient, GRADIENT_ID_RIGHT],
          [leftGradient, GRADIENT_ID_LEFT],
        ].forEach(([gradient, id]) => {
          const clone = gradient.cloneNode(true);
          clone.setAttribute("id", id);
          defs.appendChild(clone);
        });
      }

      function buildSegmentPlan(halves) {
        const plan = [
          { subpath: halves.left.reach, gradientId: GRADIENT_ID_LEFT, reversed: false, label: "left hand -> head" },
          { subpath: halves.left.loop, gradientId: GRADIENT_ID_LEFT, reversed: false, label: "left head loop" },
          { subpath: halves.left.body, gradientId: GRADIENT_ID_LEFT, reversed: true, label: "left shoulder -> valley" },
          { subpath: halves.right.body, gradientId: GRADIENT_ID_RIGHT, reversed: false, label: "right valley -> shoulder" },
          { subpath: halves.right.loop, gradientId: GRADIENT_ID_RIGHT, reversed: true, label: "right head loop" },
          { subpath: halves.right.reach, gradientId: GRADIENT_ID_RIGHT, reversed: true, label: "right head -> hand" },
        ];
        return plan.map((step) => ({
          ...step,
          d: step.reversed ? reverseAbsoluteCubicPath(step.subpath) : step.subpath,
        }));
      }

      function reverseAbsoluteCubicPath(d) {
        assertAbsoluteMoveAndCubicOnly(d);
        return serializeCubicPath(reverseCubicSegments(parseCubicPath(d)));
      }

      function assertAbsoluteMoveAndCubicOnly(d) {
        const isAbsoluteMoveAndCubicOnly = /^[MC0-9.\-,\s]+$/.test(d);
        if (!isAbsoluteMoveAndCubicOnly) {
          throw new Error(`reverseAbsoluteCubicPath only supports absolute "M"/"C" path data, got: "${d}"`);
        }
      }

      function parseCubicPath(d) {
        const numbers = d.match(/-?\d*\.?\d+/g).map(Number);
        const [startX, startY, ...rest] = numbers;
        if (rest.length % NUMBERS_PER_CUBIC_SEGMENT !== 0) {
          throw new Error(`Path data doesn't decompose into whole cubic segments: "${d}"`);
        }

        const segments = [];
        for (let i = 0; i < rest.length; i += NUMBERS_PER_CUBIC_SEGMENT) {
          segments.push({
            control1: [rest[i], rest[i + 1]],
            control2: [rest[i + 2], rest[i + 3]],
            end: [rest[i + 4], rest[i + 5]],
          });
        }
        return { start: [startX, startY], segments };
      }

      function reverseCubicSegments({ start, segments }) {
        const onCurvePoints = [start, ...segments.map((segment) => segment.end)];
        const reversedSegments = [];
        for (let i = segments.length - 1; i >= 0; i--) {
          reversedSegments.push({
            control1: segments[i].control2,
            control2: segments[i].control1,
            end: onCurvePoints[i],
          });
        }
        return { start: onCurvePoints[onCurvePoints.length - 1], segments: reversedSegments };
      }

      function serializeCubicPath({ start, segments }) {
        const segmentStrings = segments.map((segment) => {
          const [c1x, c1y] = segment.control1;
          const [c2x, c2y] = segment.control2;
          const [ex, ey] = segment.end;
          return `C${c1x} ${c1y} ${c2x} ${c2y} ${ex} ${ey}`;
        });
        return `M${start[0]} ${start[1]}${segmentStrings.join("")}`;
      }

      function renderSegments(group, segmentPlan) {
        const pathElements = segmentPlan.map(createTracePathElement);
        pathElements.forEach((pathElement) => group.appendChild(pathElement));
        return pathElements;
      }

      function createTracePathElement({ d, gradientId, label }) {
        const pathElement = document.createElementNS(SVG_NS, "path");
        pathElement.setAttribute("d", d);
        pathElement.setAttribute("pathLength", "1");
        pathElement.setAttribute("stroke", `url(#${gradientId})`);
        pathElement.setAttribute("stroke-width", String(STROKE_WIDTH));
        pathElement.setAttribute("stroke-linecap", "round");
        pathElement.dataset.segment = label;
        return pathElement;
      }

      function applyProportionalTiming(pathElements, totalDurationSeconds) {
        const lengths = pathElements.map((pathElement) => pathElement.getTotalLength());
        const totalLength = lengths.reduce((sum, length) => sum + length, 0);

        let elapsed = 0;
        pathElements.forEach((pathElement, index) => {
          const duration = (totalDurationSeconds * lengths[index]) / totalLength;
          pathElement.style.setProperty("--dur", `${duration.toFixed(3)}s`);
          pathElement.style.setProperty("--delay", `${elapsed.toFixed(3)}s`);
          elapsed += duration;
        });
      }

      function renderFallbackMark(svg, url) {
        const img = document.createElement("img");
        img.src = url;
        img.alt = "Figure Coaching logo";
        img.className = "mark";
        svg.replaceWith(img);
      }

      initMark();
    </script>
  </body>
</html>
