<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figure Coaching — Coming Soon</title>
    <meta
      name="description"
      content="Figure Coaching's website is on its way. Reach out at info@figurecoaching.hu."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500&display=swap"
    />
    <style>
      :root {
        --cream: #e3d9c5;
        --pine-900: #1b4130;
        --pine: #235e49;
        --gold: #e0ab52;
        --gold-deep: #d4a026;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--cream);
        color: var(--pine-900);
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        padding: 32px 24px;
      }

      main {
        max-width: 440px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .mark {
        width: clamp(140px, 26vw, 210px);
        height: auto;
        margin-bottom: clamp(20px, 4vw, 32px);
        overflow: visible;
      }

      .mark path {
        stroke-dasharray: 1 2;
        stroke-dashoffset: 1;
        animation: draw linear forwards;
        animation-duration: var(--dur);
        animation-delay: var(--delay);
      }

      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      .reveal {
        opacity: 0;
        transform: translateY(10px);
        animation: fadeUp 0.7s ease forwards;
      }

      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .eyebrow {
        margin: 0 0 14px;
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: lowercase;
        color: var(--gold-deep);
        animation-delay: 2.5s;
      }

      h1 {
        margin: 0 0 18px;
        font-family: "Fraunces", Georgia, "Iowan Old Style", serif;
        font-weight: 600;
        font-size: clamp(1.9rem, 5vw, 2.6rem);
        line-height: 1.25;
        color: var(--pine-900);
        animation-delay: 2.65s;
      }

      h1 em {
        font-style: italic;
        font-weight: 500;
        color: var(--gold-deep);
      }

      p {
        margin: 0 0 22px;
        font-size: 1.05rem;
        line-height: 1.6;
        color: var(--pine);
        animation-delay: 2.85s;
      }

      a {
        display: inline-block;
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 1.05rem;
        color: var(--pine-900);
        text-decoration: none;
        padding-bottom: 2px;
        background-image: linear-gradient(var(--gold), var(--gold));
        background-size: 100% 1px;
        background-repeat: no-repeat;
        background-position: 0 100%;
        transition: background-size 0.25s ease, color 0.25s ease;
        animation-delay: 3s;
      }

      a:hover,
      a:focus-visible {
        color: var(--gold-deep);
        background-size: 100% 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .mark path {
          animation: none;
          stroke-dashoffset: 0;
        }

        .reveal {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>

      </svg>

      <p class="eyebrow reveal">figure coaching</p>
      <h1 class="reveal">Still finding its <em>shape</em>.</h1>
      <p class="reveal">The new site is on its way. Say hello any time —</p>
      <a class="reveal" href="mailto:info@figurecoaching.hu">info@figurecoaching.hu</a>
    </main>
  </body>
</html>
